# =============================================================
# Employee Attrition Prediction Backend — Configuration
# =============================================================

spring.application.name=Employee-Attrition-Backend

# --- MySQL DataSource ---
spring.datasource.url=jdbc:mysql://localhost:3306/employee_attrition_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- JPA / Hibernate ---
# "validate" ensures entities match the schema without modifying the DB.
# Use "update" during early development if you prefer auto-DDL.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# --- Server ---
server.port=8080

# --- ML Microservice ---
ml.service.url=http://localhost:8000

# --- JWT (Phase 8 — values ready for later) ---
jwt.secret=YourSuperSecretKeyForJWTSigningMustBeAtLeast256BitsLong!ChangeInProduction
jwt.expiration-ms=86400000
