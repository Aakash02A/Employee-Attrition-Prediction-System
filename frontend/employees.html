<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Employees - AttritionPredict</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <link rel="stylesheet" href="css/styles.css">
<script>if(localStorage.getItem('theme')==='dark' || (!localStorage.getItem('theme') && window.matchMedia('(prefers-color-scheme: dark)').matches)){document.documentElement.setAttribute('data-theme', 'dark');document.documentElement.setAttribute('data-bs-theme', 'dark');}</script>
</head>
<body>

  <div class="app-wrapper">
    <!-- Sidebar -->
    <div id="sidebar-container"></div>
    <script src="js/sidebar.js"></script>

    <!-- Main Content Area -->
    <main class="main-content">
      <!-- Top Header -->
      <header class="top-header">
        <div class="d-flex align-items-center">
          <i class="bi bi-list mobile-toggle" id="mobileToggle"></i>
          <div class="header-search position-relative">
            <i class="bi bi-search search-icon"></i>
            <input type="text" class="form-control" placeholder="Search anything...">
          </div>
        </div>
        
        <div class="header-actions">
          <button class="icon-btn" id="themeToggle"><i class="bi bi-sun"></i></button>
          <button class="icon-btn position-relative">
            <i class="bi bi-bell"></i>
            <span class="position-absolute top-0 start-100 translate-middle p-1 bg-danger border border-light rounded-circle"></span>
          </button>
          
          <div class="user-profile dropdown">
            <div class="d-flex align-items-center" data-bs-toggle="dropdown" aria-expanded="false">
              <div class="user-info d-none d-sm-flex me-2">
                <span class="user-name">Robert Brown</span>
                <span class="user-role">HR Manager</span>
              </div>
              <img src="https://i.pravatar.cc/150?u=robert" alt="User" class="user-avatar" style="object-fit: cover;">
            </div>
            <ul class="dropdown-menu dropdown-menu-end shadow border-0">
              <li><a class="dropdown-item" href="#">Profile</a></li>
              <li><a class="dropdown-item" href="settings.html">Settings</a></li>
              <li><hr class="dropdown-divider"></li>
              <li><a class="dropdown-item text-danger" href="#" id="logoutBtn">Logout</a></li>
            </ul>
          </div>
        </div>
      </header>

      <!-- Scrollable Page Content -->
      <div class="page-content-wrapper">
        <div class="page-header">
          <div>
            <h1 class="page-title">Employees Directory</h1>
            <div class="page-subtitle">Manage and view all employee records.</div>
          </div>
          <button class="btn btn-primary"><i class="bi bi-plus-lg me-1"></i> Add Employee</button>
        </div>

        <!-- Filter Bar -->
        <div class="saas-card py-3 mb-4">
          <div class="row g-3 align-items-center">
            <div class="col-md-4">
              <div class="position-relative">
                <i class="bi bi-search position-absolute top-50 start-0 translate-middle-y ms-3 text-muted"></i>
                <input type="text" class="form-control ps-5" id="searchEmp" placeholder="Search by ID or Role...">
              </div>
            </div>
            <div class="col-md-3">
              <select class="form-select" id="filterDept">
                <option value="All">All Departments</option>
                <option value="Sales">Sales</option>
                <option value="Research & Development">Research & Development</option>
                <option value="Human Resources">Human Resources</option>
                <option value="Support">Support</option>
              </select>
            </div>
          </div>
        </div>

        <div class="saas-card p-0 overflow-hidden">
          <div class="table-responsive border-0">
            <table class="table table-hover mb-0" id="empTable">
              <thead>
                <tr>
                  <th>Emp Code</th>
                  <th>Age</th>
                  <th>Department</th>
                  <th>Job Role</th>
                  <th>Years at Company</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody id="empTableBody">
                <!-- Populated via JS -->
              </tbody>
            </table>
          </div>
        </div>

        <!-- Pagination -->
        <nav aria-label="Page navigation" class="mt-4 d-flex justify-content-between align-items-center">
          <div class="text-muted small" id="pageInfo">Showing 1 to 10 of 30 entries</div>
          <ul class="pagination pagination-sm mb-0">
            <li class="page-item disabled" id="btnPrev"><a class="page-link" href="#" onclick="changePage(-1)">Previous</a></li>
            <li class="page-item active"><a class="page-link" href="#" id="pageNum">1</a></li>
            <li class="page-item" id="btnNext"><a class="page-link" href="#" onclick="changePage(1)">Next</a></li>
          </ul>
        </nav>

      </div>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/mock-data.js"></script>
  <script src="js/app.js"></script>
  
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const allEmployees = window.MockData.employees;
      let currentData = [...allEmployees];
      
      const tbody = document.getElementById('empTableBody');
      const searchEmp = document.getElementById('searchEmp');
      const filterDept = document.getElementById('filterDept');
      
      // Pagination state
      let currentPage = 1;
      const itemsPerPage = 10;
      
      const renderTable = () => {
        tbody.innerHTML = '';
        
        const total = currentData.length;
        const totalPages = Math.ceil(total / itemsPerPage);
        
        if (currentPage > totalPages && totalPages > 0) currentPage = totalPages;
        if (currentPage < 1) currentPage = 1;
        
        const start = (currentPage - 1) * itemsPerPage;
        const end = Math.min(start + itemsPerPage, total);
        
        const pageData = currentData.slice(start, end);
        
        if (pageData.length === 0) {
          tbody.innerHTML = '<tr><td colspan="6" class="text-center py-4 text-muted">No employees found.</td></tr>';
          document.getElementById('pageInfo').textContent = 'Showing 0 entries';
          document.getElementById('btnPrev').classList.add('disabled');
          document.getElementById('btnNext').classList.add('disabled');
          return;
        }
        
        document.getElementById('pageInfo').textContent = `Showing ${start + 1} to ${end} of ${total} entries`;
        document.getElementById('pageNum').textContent = currentPage;
        
        document.getElementById('btnPrev').classList.toggle('disabled', currentPage === 1);
        document.getElementById('btnNext').classList.toggle('disabled', currentPage === totalPages);
        
        pageData.forEach(emp => {
          const tr = document.createElement('tr');
          tr.innerHTML = `
            <td class="fw-bold">${emp.empCode}</td>
            <td>${emp.age}</td>
            <td>${emp.department}</td>
            <td>${emp.jobRole}</td>
            <td>${emp.yearsAtCompany} Years</td>
            <td>
              <button class="btn btn-sm btn-outline-secondary me-1"><i class="bi bi-pencil"></i></button>
              <button class="btn btn-sm btn-outline-danger"><i class="bi bi-trash"></i></button>
            </td>
          `;
          tbody.appendChild(tr);
        });
      };
      
      window.changePage = (dir) => {
        currentPage += dir;
        renderTable();
      };
      
      const applyFilters = () => {
        const search = searchEmp.value.toLowerCase();
        const dept = filterDept.value;
        
        let filtered = allEmployees;
        
        if (search) {
          filtered = filtered.filter(e => 
            e.empCode.toLowerCase().includes(search) || 
            e.jobRole.toLowerCase().includes(search)
          );
        }
        if (dept !== 'All') {
          filtered = filtered.filter(e => e.department === dept);
        }
        
        currentData = filtered;
        currentPage = 1;
        renderTable();
      };
      
      searchEmp.addEventListener('input', applyFilters);
      filterDept.addEventListener('change', applyFilters);
      
      renderTable();
    });
  </script>
</body>
</html>
