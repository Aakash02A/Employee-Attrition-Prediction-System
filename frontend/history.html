<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prediction History - AttritionPredict</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <link rel="stylesheet" href="css/styles.css">
  <script>if(localStorage.getItem('theme')==='dark' || (!localStorage.getItem('theme') && window.matchMedia('(prefers-color-scheme: dark)').matches)){document.documentElement.setAttribute('data-theme', 'dark');document.documentElement.setAttribute('data-bs-theme', 'dark');}</script>
</head>
<body>

  <div class="app-wrapper">
    <!-- Sidebar -->
    <div id="sidebar-container"></div>
    <script src="js/sidebar.js"></script>

    <!-- Main Content Area -->
    <main class="main-content">
      <!-- Top Header -->
      <header class="top-header">
        <div class="d-flex align-items-center">
          <i class="bi bi-list mobile-toggle" id="mobileToggle"></i>
          <div class="header-search position-relative">
            <i class="bi bi-search search-icon"></i>
            <input type="text" class="form-control" placeholder="Search anything...">
          </div>
        </div>
        
        <div class="header-actions">
          <button class="icon-btn" id="themeToggle"><i class="bi bi-sun"></i></button>
          <button class="icon-btn position-relative">
            <i class="bi bi-bell"></i>
            <span class="position-absolute top-0 start-100 translate-middle p-1 bg-danger border border-light rounded-circle"></span>
          </button>
          
          <div class="user-profile dropdown">
            <div class="d-flex align-items-center" data-bs-toggle="dropdown" aria-expanded="false">
              <div class="user-info d-none d-sm-flex me-2">
                <span class="user-name">Admin</span>
                <span class="user-role">HR Manager</span>
              </div>
              <img src="https://i.pravatar.cc/150?u=admin" alt="User" class="user-avatar" style="object-fit: cover;">
            </div>
            <ul class="dropdown-menu dropdown-menu-end shadow border-0">
              <li><a class="dropdown-item" href="settings.html">Settings</a></li>
              <li><hr class="dropdown-divider"></li>
              <li><a class="dropdown-item text-danger" href="#" id="logoutBtn">Logout</a></li>
            </ul>
          </div>
        </div>
      </header>

      <!-- Scrollable Page Content -->
      <div class="page-content-wrapper">
        <div class="page-header">
          <div>
            <h1 class="page-title">Prediction History</h1>
            <div class="page-subtitle">Complete log of all historical ML prediction runs.</div>
          </div>
          <button class="btn btn-outline-secondary" onclick="exportCSV()"><i class="bi bi-download me-1"></i> Export CSV</button>
        </div>

        <!-- Notification Alert -->
        <div id="pageAlert" class="alert d-none mb-3" role="alert"></div>

        <!-- Filter Bar -->
        <div class="saas-card py-3 mb-4">
          <div class="row g-3 align-items-center">
            <div class="col-md-3">
              <div class="position-relative">
                <i class="bi bi-search position-absolute top-50 start-0 translate-middle-y ms-2 text-muted"></i>
                <input type="text" class="form-control form-control-sm ps-4" id="searchEmp" placeholder="Search Employee Code...">
              </div>
            </div>
            <div class="col-md-3">
              <select class="form-select form-select-sm" id="filterResult">
                <option value="All">All Predictions</option>
                <option value="LEAVE">Leave</option>
                <option value="STAY">Stay</option>
              </select>
            </div>
            <div class="col-md-3">
              <input type="date" class="form-control form-control-sm" id="filterDate">
            </div>
            <div class="col-md-auto ms-auto">
              <button class="btn btn-outline-secondary btn-sm" onclick="loadHistory()"><i class="bi bi-arrow-clockwise me-1"></i> Refresh</button>
            </div>
          </div>
        </div>

        <div class="saas-card p-0 overflow-hidden mb-4">
          <div class="table-responsive border-0">
            <table class="table table-hover mb-0" id="historyTable">
              <thead>
                <tr>
                  <th>Date & Time</th>
                  <th>Employee Code</th>
                  <th>Prediction</th>
                  <th>Probability</th>
                  <th>Risk Level</th>
                  <th>Model Version</th>
                  <th>Requested By</th>
                </tr>
              </thead>
              <tbody id="historyTableBody">
                <tr>
                  <td colspan="7" class="text-center py-5 text-muted">
                    <span class="spinner-border spinner-border-sm text-primary me-2" role="status"></span> Loading prediction history...
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
        
        <!-- Pagination -->
        <nav aria-label="Page navigation" class="d-flex justify-content-between align-items-center">
          <div class="text-muted small" id="pageInfo">Showing 0 entries</div>
          <ul class="pagination pagination-sm mb-0">
            <li class="page-item disabled" id="btnPrev"><a class="page-link" href="#" onclick="event.preventDefault(); changePage(-1)">Previous</a></li>
            <li class="page-item active"><a class="page-link" href="#" id="pageNum">1</a></li>
            <li class="page-item" id="btnNext"><a class="page-link" href="#" onclick="event.preventDefault(); changePage(1)">Next</a></li>
          </ul>
        </nav>

      </div>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
  
  <script>
    Auth.requireLogin();

    let allHistory = [];
    let currentData = [];
    let currentPage = 1;
    const itemsPerPage = 10;

    const tbody = document.getElementById('historyTableBody');
    const searchEmp = document.getElementById('searchEmp');
    const filterResult = document.getElementById('filterResult');
    const filterDate = document.getElementById('filterDate');

    async function loadHistory() {
      tbody.innerHTML = `
        <tr>
          <td colspan="7" class="text-center py-5 text-muted">
            <span class="spinner-border spinner-border-sm text-primary me-2" role="status"></span> Loading history from backend...
          </td>
        </tr>`;

      try {
        allHistory = await Api.getPredictions();
        applyFilters();
      } catch (err) {
        showPageAlert('danger', 'Failed to load prediction history: ' + escapeHtml(err.message));
        tbody.innerHTML = `<tr><td colspan="7" class="text-center py-4 text-danger">Error: ${escapeHtml(err.message)}</td></tr>`;
      }
    }

    function renderTable() {
      tbody.innerHTML = '';
      
      const total = currentData.length;
      const totalPages = Math.ceil(total / itemsPerPage);
      
      if (currentPage > totalPages && totalPages > 0) currentPage = totalPages;
      if (currentPage < 1) currentPage = 1;
      
      const start = (currentPage - 1) * itemsPerPage;
      const end = Math.min(start + itemsPerPage, total);
      
      const pageData = currentData.slice(start, end);
      
      if (pageData.length === 0) {
        tbody.innerHTML = '<tr><td colspan="7" class="text-center py-5 text-muted">No prediction history records found.</td></tr>';
        document.getElementById('pageInfo').textContent = 'Showing 0 entries';
        document.getElementById('btnPrev').classList.add('disabled');
        document.getElementById('btnNext').classList.add('disabled');
        return;
      }
      
      document.getElementById('pageInfo').textContent = `Showing ${start + 1} to ${end} of ${total} entries`;
      document.getElementById('pageNum').textContent = currentPage;
      
      document.getElementById('btnPrev').classList.toggle('disabled', currentPage === 1);
      document.getElementById('btnNext').classList.toggle('disabled', currentPage >= totalPages);
      
      pageData.forEach(item => {
        const isLeave = item.prediction === 'LEAVE';
        const predClass = isLeave ? 'text-danger fw-bold' : 'text-success fw-bold';
        const pct = Math.round((item.probability || 0) * 100);
        const badgeCls = item.riskLevel === 'HIGH' ? 'badge-high' : (item.riskLevel === 'MEDIUM' ? 'badge-med' : 'badge-low');
        
        let dateStr = '-';
        if (item.createdAt) {
          const d = new Date(item.createdAt);
          dateStr = d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric', hour: '2-digit', minute: '2-digit' });
        }

        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td>${dateStr}</td>
          <td class="fw-bold text-dark">${escapeHtml(item.empCode || '#' + item.employeeId)}</td>
          <td class="${predClass}">${isLeave ? 'Leave' : 'Stay'}</td>
          <td>${pct}%</td>
          <td><span class="badge ${badgeCls}">${item.riskLevel || '-'}</span></td>
          <td class="text-muted small">${escapeHtml(item.modelVersion || '-')}</td>
          <td class="small">${escapeHtml(item.requestedBy || 'admin')}</td>
        `;
        tbody.appendChild(tr);
      });
    }

    function changePage(dir) {
      currentPage += dir;
      renderTable();
    }

    function applyFilters() {
      const search = searchEmp.value.toLowerCase().trim();
      const res = filterResult.value;
      const date = filterDate.value; // YYYY-MM-DD
      
      let filtered = [...allHistory];
      
      if (search) {
        filtered = filtered.filter(h => 
          (h.empCode && h.empCode.toLowerCase().includes(search)) ||
          (h.employeeDepartment && h.employeeDepartment.toLowerCase().includes(search))
        );
      }
      if (res !== 'All') {
        filtered = filtered.filter(h => h.prediction === res);
      }
      if (date) {
        filtered = filtered.filter(h => {
          if (!h.createdAt) return false;
          return h.createdAt.startsWith(date);
        });
      }
      
      currentData = filtered;
      currentPage = 1;
      renderTable();
    }

    searchEmp.addEventListener('input', applyFilters);
    filterResult.addEventListener('change', applyFilters);
    filterDate.addEventListener('change', applyFilters);

    function exportCSV() {
      if (currentData.length === 0) return;
      let csv = 'CreatedAt,EmployeeCode,Prediction,Probability,RiskLevel,ModelVersion,RequestedBy\n';
      currentData.forEach(row => {
        csv += `"${row.createdAt || ''}","${row.empCode || ''}","${row.prediction || ''}",${row.probability || 0},"${row.riskLevel || ''}","${row.modelVersion || ''}","${row.requestedBy || ''}"\n`;
      });
      const blob = new Blob([csv], { type: 'text/csv' });
      const url = window.URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.setAttribute('href', url);
      a.setAttribute('download', `prediction_history_${new Date().toISOString().slice(0,10)}.csv`);
      a.click();
    }

    function showPageAlert(type, message) {
      const alert = document.getElementById('pageAlert');
      alert.className = `alert alert-${type}`;
      alert.innerHTML = message;
      alert.classList.remove('d-none');
    }

    function escapeHtml(str) {
      const div = document.createElement('div');
      div.appendChild(document.createTextNode(str || ''));
      return div.innerHTML;
    }

    document.addEventListener('DOMContentLoaded', loadHistory);
  </script>
</body>
</html>
