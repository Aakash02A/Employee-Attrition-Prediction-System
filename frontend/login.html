<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - AttritionPredict</title>
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  
  <!-- Custom CSS -->
  <link rel="stylesheet" href="css/styles.css">
  <script>if(localStorage.getItem('theme')==='dark' || (!localStorage.getItem('theme') && window.matchMedia('(prefers-color-scheme: dark)').matches)){document.documentElement.setAttribute('data-theme', 'dark');document.documentElement.setAttribute('data-bs-theme', 'dark');}</script>
</head>
<body>

  <div class="login-container">
    <div class="login-card">
      <div class="login-logo">
        <i class="bi bi-hexagon-fill"></i> AttritionPredict
      </div>
      
      <form id="loginForm">
        <div id="loginAlert" class="alert alert-danger d-none" role="alert">
          Invalid email or password.
        </div>

        <div class="mb-3">
          <label for="email" class="form-label">Email Address</label>
          <input type="email" class="form-control" id="email" placeholder="name@company.com" required>
        </div>
        
        <div class="mb-4">
          <label for="password" class="form-label">Password</label>
          <input type="password" class="form-control" id="password" placeholder="********" required>
        </div>
        
        <button type="submit" class="btn btn-primary w-100" id="loginBtn">
          <span id="btnText">Log In</span>
          <span id="btnSpinner" class="spinner-border spinner-border-sm d-none" role="status" aria-hidden="true"></span>
        </button>
      </form>
      
      <!-- Instructions / credentials hint -->
      <div class="mt-4 text-center text-muted small">
        <p class="mb-0"><em>Default Admin: <code>admin@eaps.com</code> / <code>admin123</code></em></p>
      </div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script>
    // If already logged in, redirect to dashboard
    if (Auth.getToken()) {
      window.location.href = 'dashboard.html';
    }

    document.getElementById('loginForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      
      const email = document.getElementById('email').value.trim();
      const pass = document.getElementById('password').value;
      const alertBox = document.getElementById('loginAlert');
      const btnText = document.getElementById('btnText');
      const btnSpinner = document.getElementById('btnSpinner');
      const loginBtn = document.getElementById('loginBtn');
      
      // UI Loading state
      loginBtn.disabled = true;
      btnText.textContent = 'Logging in...';
      btnSpinner.classList.remove('d-none');
      alertBox.classList.add('d-none');
      
      try {
        await Auth.login(email, pass);
        window.location.href = 'dashboard.html';
      } catch (err) {
        alertBox.textContent = err.message || 'Invalid email or password.';
        alertBox.classList.remove('d-none');
        loginBtn.disabled = false;
        btnText.textContent = 'Log In';
        btnSpinner.classList.add('d-none');
      }
    });
  </script>
</body>
</html>
